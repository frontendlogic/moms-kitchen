<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Korean Cuisine</title>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #fefaf6;
    margin: 0;
    padding: 0;
  }

  h1 {
    color: #16a085;
    text-align: left;
    margin: 20px;
  }

  .menu-icon {
    font-size: 28px;
    cursor: pointer;
    color: #16a085;
    margin-left: 20px;
  }

  /* Modal common styles */
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: rgba(0,0,0,0.5);
    justify-content: center;
    align-items: center;
    z-index: 10;
  }

  .modal-content {
    background: #fff;
    padding: 20px;
    border-radius: 12px;
    width: 400px;
    max-width: 90%;
    text-align: center;
    position: relative;
    box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    animation: popUp 0.3s ease-in-out;
  }

  @keyframes popUp {
    from { transform: scale(0.8); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }

  .close-x {
    position: absolute;
    top: 8px;
    right: 15px;
    font-size: 22px;
    color: #555;
    cursor: pointer;
  }

  .modal-content h2 {
    margin-bottom: 15px;
    color: #16a085;
  }

  .modal-content label {
    display: block;
    margin: 8px 0;
    padding: 10px;
    border-radius: 8px;
    background: #f4f6f7;
    cursor: pointer;
    transition: background 0.3s;
  }

  .modal-content label:hover {
    background: #a3e4d7;
  }

  .close-btn {
    background: #1abc9c;
    color: #fff;
    border: none;
    padding: 8px 12px;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 15px;
  }

  .dishes {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
  }

  .dish {
    background: white;
    padding: 15px;
    border-radius: 10px;
    box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    text-align: center;
    transition: transform 0.2s;
    cursor: pointer;
  }

  .dish:hover {
    transform: scale(1.03);
  }

  .dish img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
  }

  .dish h3 {
    margin: 10px 0;
    color: #2c3e50;
  }

  #dishModal img, #dishModal video {
    width: 100%;
    border-radius: 10px;
    margin-top: 10px;
  }

  /* Like button */
  .like-btn {
    background: none;
    border: none;
    color: #e74c3c;
    font-size: 28px;
    cursor: pointer;
    margin-top: 10px;
    transition: transform 0.2s ease;
  }

  .like-btn:active {
    transform: scale(1.3);
  }

  .like-count {
    color: #555;
    font-weight: bold;
    font-size: 16px;
  }
</style>
</head>
<body>

<h1>🍜 Korean Cuisine</h1>
<span class="menu-icon" onclick="openMenu()">☰ Menu</span>

<!-- Menu Modal -->
<div id="menuModal" class="modal">
  <div class="modal-content">
    <span class="close-x" onclick="closeMenu()">&times;</span>
    <h2>Select Category</h2>
    <label><input type="radio" name="cuisine" value="all" checked> All</label>
    <label><input type="radio" name="cuisine" value="bbq"> Korean BBQ</label>
    <label><input type="radio" name="cuisine" value="noodles"> Noodles</label>
    <label><input type="radio" name="cuisine" value="stew"> Stews & Soups</label>
    <label><input type="radio" name="cuisine" value="street"> Street Food</label>
    <button class="close-btn" onclick="closeMenu()">Close</button>
  </div>
</div>

<!-- Dish Modal -->
<div id="dishModal" class="modal">
  <div class="modal-content">
    <span class="close-x" onclick="closeDishModal()">&times;</span>
    <h2 id="dishTitle"></h2>
    <img id="dishImage" src="" alt="">
    <p id="dishDescription"></p>
    <video id="dishVideo" controls></video>
    <button class="like-btn" id="likeBtn" onclick="likeDish()">❤️Like</button>
    <p class="like-count" id="likeCount">Likes: 0</p>
  </div>
</div>

<!-- Dishes -->
<div class="dishes">
  <div class="dish bbq" onclick="openDishModal('Korean BBQ', 'Traditional Korean BBQ with sauces and lettuce.', 'https://via.placeholder.com/400x250?text=Korean+BBQ', 'https://www.w3schools.com/html/mov_bbb.mp4')">
    <img src="https://via.placeholder.com/250x150?text=Korean+BBQ"><h3>Korean BBQ</h3>
  </div>
  <div class="dish noodles" onclick="openDishModal('Ramyeon', 'Spicy Korean noodles cooked with gochujang.', 'https://via.placeholder.com/400x250?text=Ramyeon', 'https://www.w3schools.com/html/mov_bbb.mp4')">
    <img src="https://via.placeholder.com/250x150?text=Ramyeon"><h3>Ramyeon</h3>
  </div>
  <div class="dish stew" onclick="openDishModal('Kimchi Jjigae', 'A spicy stew made with kimchi and tofu.', 'https://via.placeholder.com/400x250?text=Kimchi+Jjigae', 'https://www.w3schools.com/html/mov_bbb.mp4')">
    <img src="https://via.placeholder.com/250x150?text=Kimchi+Jjigae"><h3>Kimchi Jjigae</h3>
  </div>
  <div class="dish street" onclick="openDishModal('Tteokbokki', 'Spicy rice cakes, popular Korean street food.', 'https://via.placeholder.com/400x250?text=Tteokbokki', 'https://www.w3schools.com/html/mov_bbb.mp4')">
    <img src="https://via.placeholder.com/250x150?text=Tteokbokki"><h3>Tteokbokki</h3>
  </div>
</div>

<script>
  // Menu Modal Controls
  function openMenu() {
    document.getElementById("menuModal").style.display = "flex";
  }

  function closeMenu() {
    document.getElementById("menuModal").style.display = "none";
  }

  // Filter logic
  const radios = document.querySelectorAll('input[name="cuisine"]');
  const dishes = document.querySelectorAll('.dish');
  
  radios.forEach(radio => {
    radio.addEventListener('change', () => {
      const cuisine = radio.value;
      dishes.forEach(dish => {
        dish.style.display = cuisine === 'all' || dish.classList.contains(cuisine) ? 'block' : 'none';
      });
    });
  });

  // Dish modal logic
  let dishLikes = {};
  let currentDish = '';

  function openDishModal(title, description, image, video) {
    currentDish = title;
    document.getElementById("dishTitle").textContent = title;
    document.getElementById("dishDescription").textContent = description;
    document.getElementById("dishImage").src = image;
    document.getElementById("dishVideo").src = video;
    document.getElementById("dishModal").style.display = "flex";

    if (!dishLikes[currentDish]) {
      dishLikes[currentDish] = 0;
    }
    updateLikeCount();
  }

  function closeDishModal() {
    document.getElementById("dishModal").style.display = "none";
    document.getElementById("dishVideo").pause();
  }

  function likeDish() {
    dishLikes[currentDish]++;
    updateLikeCount();

    // pulse animation
    const btn = document.getElementById("likeBtn");
    btn.style.transform = "scale(1.3)";
    setTimeout(() => btn.style.transform = "scale(1)", 200);
  }

  function updateLikeCount() {
    document.getElementById("likeCount").textContent = "Likes: " + dishLikes[currentDish];
  }
</script>

</body>
</html>
