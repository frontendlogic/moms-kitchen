 {% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="{% static 'css/style.css'%}">
    <style>
        body {
            
            font-family: 'Arial', sans-serif;
            background-color:#734e7c;
        }

        .form-container {
            
           max-width: 400px;
    margin: 60px auto;
    background-color: #e6f2e6; /* Light green to match navbar */
    padding: 63px;
    border-radius: 18px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .form-container h2 {
           text-align: center;
    margin-bottom: 20px;
    color: #442c4b;
        }

        input {
            width: 93%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color:#734e7c;
            color: white;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: rgb(115, 201, 128);
            color:#442c4b;
        }

        p {
            background-color: #e6f2e6;
            text-align: center;
            color: #050505;
            margin-top: 15px;
        }

        a {
            color: #442c4b;
            font-weight: bold;
            text-decoration: none;
        }
    </style>
</head>
<body>
{% load static %}
<div class="background-slider">
    <img src="{% static 'image/p1.jpg' %}" class="bg-slide active">
    <img src= "{% static 'image/p2.jpg' %}" class="bg-slide  ">
    <img src="{% static 'image/bp3.jpg' %}" class="bg-slide">

</div>


<div class="form-container">
    <h2>Forgot Password</h2>
    <form method="post">
        {% csrf_token %}
        <p>Please enter your registered email address. We’ll send you a link to reset your password.</p>
        <input type="email" name="email" placeholder="Enter your email" required>
        <button type="submit">Send Reset Link</button>
        <p><a href="{% url 'login' %}">Back to Login</a></p>
    </form>
</div>
  <!--Footer -->
{% include 'partials/footer.html' %}
</body>
</html>
