<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Thai Cuisine</title>
 <style>
    body {
      font-family: Arial, sans-serif;
      background: #fefaf6;
      margin: 0;
      padding: 0;
    }

    h1 {
      color: #2c3e50;
      text-align: left;
      margin: 20px;
    }

    .menu-icon {
      font-size: 28px;
      cursor: pointer;
      color: #2c3e50;
      margin-left: 20px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 10;
    }

    .modal-content {
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      width: 400px;
      max-width: 90%;
      text-align: center;
      position: relative;
    }

    .close-x {
      position: absolute;
      top: 8px;
      right: 15px;
      font-size: 22px;
      color: #555;
      cursor: pointer;
    }

    .modal-content h2 {
      margin-bottom: 15px;
      color: #2c3e50;
    }

    .modal-content label {
      display: block;
      margin: 8px 0;
      padding: 10px;
      border-radius: 8px;
      background: #f4f6f7;
      cursor: pointer;
      transition: background 0.3s;
    }

    .modal-content label:hover {
      background: #d6eaf8;
    }

    .close-btn {
      background: #2980b9;
      color: #fff;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-top: 15px;
    }

    .dishes {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      padding: 20px;
    }

    .dish {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.1);
      text-align: center;
      transition: transform 0.2s;
    }

    .dish:hover {
      transform: scale(1.03);
      cursor: pointer;
    }

    .dish img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    .dish h3 {
      margin: 10px 0;
      color: #2c3e50;
    }

    #dishModal img, #dishModal video {
      width: 100%;
      border-radius: 10px;
      margin-top: 10px;
    }

    /* Like Button */
    .like-btn {
      background: none;
      border: none;
      color: #e74c3c;
      font-size: 20px;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .like-btn:hover {
      transform: scale(1.2);
    }

    .like-count {
      color: #2c3e50;
      font-weight: bold;
      font-size: 14px;
      margin-top: 5px;
    }

  </style>
</head>
<body>

  <h1>🍲 Thai Cuisine</h1>
  <span class="menu-icon">☰ Menu</span>

  <!-- Thai Dishes -->
  <div class="dishes">
    <div class="dish" onclick="showDish('Pad Thai', 'Pad Thai is a classic stir-fried noodle dish with tamarind sauce, tofu, and peanuts.', 'https://via.placeholder.com/250x150?text=Pad+Thai', 'https://www.w3schools.com/html/mov_bbb.mp4')">
      <img src="https://via.placeholder.com/250x150?text=Pad+Thai" alt="Pad Thai">
      <h3>Pad Thai</h3>
    </div>

    <div class="dish" onclick="showDish('Green Curry', 'A rich, creamy coconut-based curry with Thai herbs and vegetables.', 'https://via.placeholder.com/250x150?text=Green+Curry', 'https://www.w3schools.com/html/movie.mp4')">
      <img src="https://via.placeholder.com/250x150?text=Green+Curry" alt="Green Curry">
      <h3>Green Curry</h3>
    </div>
  </div>

 <!-- Dish Modal -->
  <div id="dishModal" class="modal">
    <div class="modal-content">
      <span class="close-x" onclick="closeModal()">&times;</span>
      <h2 id="dishTitle"></h2>
      <img id="dishImage" src="" alt="Dish" style="width:100%; border-radius:10px; margin-bottom:10px;">
      <p id="dishDesc"></p>
      <video id="dishVideo" controls></video>
      <button class="like-btn" id="likeBtn" onclick="likeDish()">❤️ Like</button><br>
      <p class="like-count" id="likeCount">Likes: 0</p>     

    </div>
  </div>

  <script>
    // Track likes per dish
    let currentDish = '';
    const dishLikes = {};

    function showDish(title, desc, image, video) {
      currentDish = title;
      document.getElementById('dishTitle').innerText = title;
      document.getElementById('dishDesc').innerText = desc;
      document.getElementById('dishImage').src = image;
      document.getElementById('dishVideo').src = video;
      document.getElementById('dishModal').style.display = 'flex';

      // Initialize if first time
      if (!dishLikes[currentDish]) dishLikes[currentDish] = 0;
      updateLikeDisplay();
    }

    function closeModal() {
      document.getElementById('dishModal').style.display = 'none';
      document.getElementById('dishVideo').pause();
    }

    const likeBtn = document.getElementById('likeBtn');
    const likeCount = document.getElementById('likeCount');

    likeBtn.addEventListener('click', () => {
      dishLikes[currentDish]++;
      likeBtn.classList.add('liked');
      updateLikeDisplay();
    });

    function updateLikeDisplay() {
      likeCount.textContent = dishLikes[currentDish];
    }
  </script>

</body>
</html>
